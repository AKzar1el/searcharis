# Copy into the CONSUMER site's .github/workflows/ only after reviewing it.
# Inert example in Searcharis: this repository does not activate this workflow.
name: Static SEO contract (reviewed site)

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-seo:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout the site
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Checkout audited Searcharis source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: AKzar1el/searcharis
          ref: 47e92a7ce4fcba87d1fb523e066db7ad5351822d
          path: .sear-checker
          persist-credentials: false

      - name: Set up Node for the site build
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      - name: Set up Python for the local checker
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'

      - name: Compile static HTML (adapt to your generator)
        run: |
          npm ci
          npm run build

      # A candidate pull request must not supply its own prior approvals.
      - name: Checkout prior approved SEO manifest
        if: github.event_name == 'pull_request'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: .seo-approved-base
          sparse-checkout: seo-manifest.json
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Reject changed previously approved assertions
        id: review_approved_assertions
        if: github.event_name == 'pull_request'
        env:
          PYTHONPATH: ${{ github.workspace }}/.sear-checker/src
        run: |
          if [ -f .seo-approved-base/seo-manifest.json ]; then
            mkdir -p seo-ci-reports
            # The Markdown reviewer report is create-only. Preserve exit 0/1/2.
            set +e
            python -S -m searcharis.manifest_review_cli \
              .seo-approved-base/seo-manifest.json seo-manifest.json dist \
              --github-annotations --markdown-file seo-ci-reports/approval-review.md
            approval_status=$?
            set -e
            if [ "$approval_status" -le 1 ] && [ -f seo-ci-reports/approval-review.md ]; then
              cat seo-ci-reports/approval-review.md >> "$GITHUB_STEP_SUMMARY"
            fi
            exit "$approval_status"
          else
            echo "::notice title=Initial SEO manifest adoption::No approved base manifest; human review required."
            printf '%s\n' \
              '### Initial SEO manifest adoption - manual review required' \
              '' \
              'No previously approved `seo-manifest.json` exists at the trusted PR base.' \
              'Approval-integrity comparison was **not run**. A passing compiled-site check' \
              'does **not** approve the new manifest or unreviewed pages. Review the' \
              'candidate manifest in this pull request before accepting it.' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Verify developer-reviewed SEO contracts
        # Preserve both failure signals: an approval drift must not hide SEO regressions.
        # Do not run after an unrelated checkout/build failure or cancellation.
        if: ${{ success() || (failure() && steps.review_approved_assertions.outcome == 'failure') }}
        env:
          PYTHONPATH: ${{ github.workspace }}/.sear-checker/src
        run: |
          mkdir -p seo-ci-reports
          # Preserve native exit 0/1/2, even when we append a reviewer summary.
          set +e
          python -S -m searcharis.site_cli seo-manifest.json dist \
            --check-canonical-consistency \
            --report-dir seo-ci-reports --github-annotations
          gate_status=$?
          set -e
          if [ "$gate_status" -le 1 ] && [ -f seo-ci-reports/seo-site.md ]; then
            cat seo-ci-reports/seo-site.md >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$gate_status"

# No artifact upload, production crawl, deployment, secret or paid API access.
# Add reviewer-approved artifact collection separately if your team needs it.
# After reviewing every built HTML page, opt in to --require-full-coverage.
