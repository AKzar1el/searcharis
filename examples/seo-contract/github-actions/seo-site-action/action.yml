name: Searcharis offline static SEO gate
description: Check developer-reviewed static HTML assertions without cloud credentials or URL fetches.
inputs:
  manifest:
    description: Site-relative path to the committed, developer-reviewed JSON manifest.
    required: true
  build-root:
    description: Site-relative path to the already compiled HTML directory.
    required: true
  baseline-build-root:
    description: Optional separate trusted compiled baseline directory; enables regression-only comparisons, never fetches a baseline.
    required: false
    default: ''
  fail-on-new-unlisted:
    description: With a trusted baseline, reject only newly unlisted HTML paths without blocking inherited coverage gaps.
    required: false
    default: 'false'
  fail-on-new-unverified-targets:
    description: With a trusted baseline, reject newly unverified canonical or hreflang targets from enabled cross-page checks.
    required: false
    default: 'false'
  require-full-coverage:
    description: Reject unreviewed built HTML paths after the site has completed manual onboarding.
    required: false
    default: 'false'
  check-hreflang-reciprocity:
    description: Optionally check return links between manifest-listed local language variants.
    required: false
    default: 'false'
  check-hreflang-clusters:
    description: Optionally require consistent complete local hreflang locale maps between reviewed pages.
    required: false
    default: 'false'
  check-internal-nofollow:
    description: Optionally reject rel=nofollow links to reviewed same-origin HTML pages.
    required: false
    default: 'false'
  check-reviewed-navigation:
    description: Optionally reject same-origin HTML links to URLs absent from the reviewed manifest.
    required: false
    default: 'false'
  check-reviewed-fragments:
    description: Optionally reject missing fragment targets on reviewed same-origin HTML pages.
    required: false
    default: 'false'
  require-inbound-paths:
    description: Optional newline-separated reviewed HTML paths requiring an inbound link from another reviewed same-origin page (max 128).
    required: false
    default: ''
  check-unique-titles:
    description: Optionally reject duplicate titles among reviewed, same-origin indexable pages.
    required: false
    default: 'false'
  check-unique-descriptions:
    description: Optionally reject duplicate descriptions among reviewed, same-origin indexable pages.
    required: false
    default: 'false'
  report-directory:
    description: Optional existing directory outside the compiled build for create-only JSON/JUnit/Markdown/SARIF reports.
    required: false
    default: ''
  sarif-source-map:
    description: Optional reviewed JSON map of built HTML artifacts to existing repository source files for local SARIF hints.
    required: false
    default: ''
runs:
  using: composite
  steps:
    - name: Check built HTML against reviewed SEO contracts
      shell: bash
      env:
        SEO_MANIFEST: ${{ inputs.manifest }}
        SEO_BUILD_ROOT: ${{ inputs.build-root }}
        SEO_BASELINE_BUILD_ROOT: ${{ inputs.baseline-build-root }}
        SEO_FAIL_ON_NEW_UNLISTED: ${{ inputs.fail-on-new-unlisted }}
        SEO_FAIL_ON_NEW_UNVERIFIED: ${{ inputs.fail-on-new-unverified-targets }}
        SEO_STRICT_COVERAGE: ${{ inputs.require-full-coverage }}
        SEO_HREFLANG_RECIPROCITY: ${{ inputs.check-hreflang-reciprocity }}
        SEO_HREFLANG_CLUSTERS: ${{ inputs.check-hreflang-clusters }}
        SEO_INTERNAL_NOFOLLOW: ${{ inputs.check-internal-nofollow }}
        SEO_REVIEWED_NAVIGATION: ${{ inputs.check-reviewed-navigation }}
        SEO_REVIEWED_FRAGMENTS: ${{ inputs.check-reviewed-fragments }}
        SEO_REQUIRED_INBOUND_PATHS: ${{ inputs.require-inbound-paths }}
        SEO_UNIQUE_TITLES: ${{ inputs.check-unique-titles }}
        SEO_UNIQUE_DESCRIPTIONS: ${{ inputs.check-unique-descriptions }}
        SEO_REPORT_DIRECTORY: ${{ inputs.report-directory }}
        SEO_SOURCE_MAP: ${{ inputs.sarif-source-map }}
        PYTHONPATH: ${{ github.action_path }}/../../../../src
      run: |
        set -euo pipefail
        if [ -z "$SEO_MANIFEST" ] || [ -z "$SEO_BUILD_ROOT" ]; then
          echo "SEO manifest and build-root paths are required." >&2
          exit 2
        fi
        case "$SEO_STRICT_COVERAGE" in
          true|false) ;;
          *)
            echo "require-full-coverage must be exactly true or false." >&2
            exit 2
            ;;
        esac
        case "$SEO_HREFLANG_RECIPROCITY" in
          true|false) ;;
          *)
            echo "check-hreflang-reciprocity must be exactly true or false." >&2
            exit 2
            ;;
        esac
        case "${SEO_HREFLANG_CLUSTERS:-false}" in
          true|false) ;;
          *)
            echo "check-hreflang-clusters must be exactly true or false." >&2
            exit 2
            ;;
        esac
        case "$SEO_INTERNAL_NOFOLLOW" in
          true|false) ;;
          *)
            echo "check-internal-nofollow must be exactly true or false." >&2
            exit 2
            ;;
        esac
        case "$SEO_REVIEWED_NAVIGATION" in
          true|false) ;;
          *)
            echo "check-reviewed-navigation must be exactly true or false." >&2
            exit 2
            ;;
        esac
        case "$SEO_REVIEWED_FRAGMENTS" in
          true|false) ;;
          *)
            echo "check-reviewed-fragments must be exactly true or false." >&2
            exit 2
            ;;
        esac
        case "$SEO_UNIQUE_TITLES" in
          true|false) ;;
          *)
            echo "check-unique-titles must be exactly true or false." >&2
            exit 2
            ;;
        esac
        case "$SEO_UNIQUE_DESCRIPTIONS" in
          true|false) ;;
          *)
            echo "check-unique-descriptions must be exactly true or false." >&2
            exit 2
            ;;
        esac
        case "${SEO_FAIL_ON_NEW_UNLISTED:-false}" in
          true|false) ;;
          *)
            echo "fail-on-new-unlisted must be exactly true or false." >&2
            exit 2
            ;;
        esac
        case "${SEO_FAIL_ON_NEW_UNVERIFIED:-false}" in
          true|false) ;;
          *)
            echo "fail-on-new-unverified-targets must be exactly true or false." >&2
            exit 2
            ;;
        esac
        if [ -z "${SEO_BASELINE_BUILD_ROOT:-}" ] && {
          [ "${SEO_FAIL_ON_NEW_UNLISTED:-false}" = true ] ||
          [ "${SEO_FAIL_ON_NEW_UNVERIFIED:-false}" = true ]; }; then
          echo "Incremental coverage options require a trusted baseline-build-root." >&2
          exit 2
        fi

        if [ -n "$SEO_REPORT_DIRECTORY" ]; then
          # A consumer-owned existing directory preserves reviewer artifacts.
          report_dir="$SEO_REPORT_DIRECTORY"
        else
          report_dir="$(mktemp -d)"
        fi
        if [ -n "${SEO_BASELINE_BUILD_ROOT:-}" ]; then
          options=("$SEO_MANIFEST" "$SEO_BASELINE_BUILD_ROOT" "$SEO_BUILD_ROOT")
          summary_name=seo-comparison.md
        else
          options=("$SEO_MANIFEST" "$SEO_BUILD_ROOT")
          summary_name=seo-site.md
        fi
        options+=(--check-canonical-consistency --github-annotations --report-dir "$report_dir")
        if [ "${SEO_FAIL_ON_NEW_UNLISTED:-false}" = true ]; then
          options+=(--fail-on-new-unlisted)
        fi
        if [ "${SEO_FAIL_ON_NEW_UNVERIFIED:-false}" = true ]; then
          options+=(--fail-on-new-unverified-targets)
        fi
        if [ -n "${SEO_SOURCE_MAP:-}" ]; then
          options+=(--sarif-source-map "$SEO_SOURCE_MAP")
        fi
        if [ "$SEO_STRICT_COVERAGE" = true ]; then
          options+=(--require-full-coverage)
        fi
        if [ "$SEO_HREFLANG_RECIPROCITY" = true ]; then
          options+=(--check-hreflang-reciprocity)
        fi
        if [ "${SEO_HREFLANG_CLUSTERS:-false}" = true ]; then
          options+=(--check-hreflang-clusters)
        fi
        if [ "$SEO_INTERNAL_NOFOLLOW" = true ]; then
          options+=(--check-internal-nofollow)
        fi
        if [ "$SEO_REVIEWED_NAVIGATION" = true ]; then
          options+=(--check-reviewed-navigation)
        fi
        if [ "$SEO_REVIEWED_FRAGMENTS" = true ]; then
          options+=(--check-reviewed-fragments)
        fi
        if [ "$SEO_UNIQUE_TITLES" = true ]; then
          options+=(--check-unique-titles)
        fi
        if [ "$SEO_UNIQUE_DESCRIPTIONS" = true ]; then
          options+=(--check-unique-descriptions)
        fi
        if [ -n "${SEO_REQUIRED_INBOUND_PATHS:-}" ]; then
          inbound_count=0
          # Drop the optional final YAML block-scalar newline, not interior blanks.
          while IFS= read -r inbound_path; do
            inbound_path="${inbound_path%$'\r'}"
            if [ -z "$inbound_path" ]; then
              echo "require-inbound-paths contains an empty reviewed path." >&2
              exit 2
            fi
            inbound_count=$((inbound_count + 1))
            if [ "$inbound_count" -gt 128 ]; then
              echo "require-inbound-paths supports at most 128 paths." >&2
              exit 2
            fi
            options+=(--require-inbound-link "$inbound_path")
          done <<< "${SEO_REQUIRED_INBOUND_PATHS%$'\n'}"
        fi

        # Both a failing assertion (1) and invalid input (2) must still fail CI.
        set +e
        if [ -n "${SEO_BASELINE_BUILD_ROOT:-}" ]; then
          python3 -S -m searcharis.build_compare "${options[@]}"
        else
          python3 -S -m searcharis.site_cli "${options[@]}"
        fi
        status=$?
        set -e
        if [ "$status" -le 1 ] && [ -f "$report_dir/$summary_name" ]; then
          if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
            cat "$report_dir/$summary_name" >> "$GITHUB_STEP_SUMMARY"
          fi
        fi
        exit "$status"
