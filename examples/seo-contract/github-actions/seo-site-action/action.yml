name: Searcharis offline static SEO gate
description: Check developer-reviewed static HTML assertions without cloud credentials or URL fetches.
inputs:
  manifest:
    description: Site-relative path to the committed, developer-reviewed JSON manifest.
    required: true
  build-root:
    description: Site-relative path to the already compiled HTML directory.
    required: true
  require-full-coverage:
    description: Reject unreviewed built HTML paths after the site has completed manual onboarding.
    required: false
    default: 'false'
  check-hreflang-reciprocity:
    description: Optionally check return links between manifest-listed local language variants.
    required: false
    default: 'false'
  check-internal-nofollow:
    description: Optionally reject rel=nofollow links to reviewed same-origin HTML pages.
    required: false
    default: 'false'
  check-unique-titles:
    description: Optionally reject duplicate titles among reviewed, same-origin indexable pages.
    required: false
    default: 'false'
  check-unique-descriptions:
    description: Optionally reject duplicate descriptions among reviewed, same-origin indexable pages.
    required: false
    default: 'false'
  report-directory:
    description: Optional existing directory outside the compiled build for create-only JSON/JUnit/Markdown/SARIF reports.
    required: false
    default: ''
runs:
  using: composite
  steps:
    - name: Check built HTML against reviewed SEO contracts
      shell: bash
      env:
        SEO_MANIFEST: ${{ inputs.manifest }}
        SEO_BUILD_ROOT: ${{ inputs.build-root }}
        SEO_STRICT_COVERAGE: ${{ inputs.require-full-coverage }}
        SEO_HREFLANG_RECIPROCITY: ${{ inputs.check-hreflang-reciprocity }}
        SEO_INTERNAL_NOFOLLOW: ${{ inputs.check-internal-nofollow }}
        SEO_UNIQUE_TITLES: ${{ inputs.check-unique-titles }}
        SEO_UNIQUE_DESCRIPTIONS: ${{ inputs.check-unique-descriptions }}
        SEO_REPORT_DIRECTORY: ${{ inputs.report-directory }}
        PYTHONPATH: ${{ github.action_path }}/../../../../src
      run: |
        set -euo pipefail
        if [ -z "$SEO_MANIFEST" ] || [ -z "$SEO_BUILD_ROOT" ]; then
          echo "SEO manifest and build-root paths are required." >&2
          exit 2
        fi
        case "$SEO_STRICT_COVERAGE" in
          true|false) ;;
          *)
            echo "require-full-coverage must be exactly true or false." >&2
            exit 2
            ;;
        esac
        case "$SEO_HREFLANG_RECIPROCITY" in
          true|false) ;;
          *)
            echo "check-hreflang-reciprocity must be exactly true or false." >&2
            exit 2
            ;;
        esac
        case "$SEO_INTERNAL_NOFOLLOW" in
          true|false) ;;
          *)
            echo "check-internal-nofollow must be exactly true or false." >&2
            exit 2
            ;;
        esac
        case "$SEO_UNIQUE_TITLES" in
          true|false) ;;
          *)
            echo "check-unique-titles must be exactly true or false." >&2
            exit 2
            ;;
        esac
        case "$SEO_UNIQUE_DESCRIPTIONS" in
          true|false) ;;
          *)
            echo "check-unique-descriptions must be exactly true or false." >&2
            exit 2
            ;;
        esac

        if [ -n "$SEO_REPORT_DIRECTORY" ]; then
          # A consumer-owned existing directory preserves reviewer artifacts.
          report_dir="$SEO_REPORT_DIRECTORY"
        else
          report_dir="$(mktemp -d)"
        fi
        options=("$SEO_MANIFEST" "$SEO_BUILD_ROOT")
        options+=(--check-canonical-consistency --github-annotations --report-dir "$report_dir")
        if [ "$SEO_STRICT_COVERAGE" = true ]; then
          options+=(--require-full-coverage)
        fi
        if [ "$SEO_HREFLANG_RECIPROCITY" = true ]; then
          options+=(--check-hreflang-reciprocity)
        fi
        if [ "$SEO_INTERNAL_NOFOLLOW" = true ]; then
          options+=(--check-internal-nofollow)
        fi
        if [ "$SEO_UNIQUE_TITLES" = true ]; then
          options+=(--check-unique-titles)
        fi
        if [ "$SEO_UNIQUE_DESCRIPTIONS" = true ]; then
          options+=(--check-unique-descriptions)
        fi

        # Both a failing assertion (1) and invalid input (2) must still fail CI.
        set +e
        python3 -S -m searcharis.site_cli "${options[@]}"
        status=$?
        set -e
        if [ "$status" -le 1 ] && [ -f "$report_dir/seo-site.md" ]; then
          if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
            cat "$report_dir/seo-site.md" >> "$GITHUB_STEP_SUMMARY"
          fi
        fi
        exit "$status"
