name: Deploy to Google Cloud

on:
  push:
    branches: [gcp-deploy]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: searcharis-gcp-deploy
  cancel-in-progress: false

env:
  GOOGLE_CLOUD_PROJECT: searcharis
  GOOGLE_CLOUD_LOCATION: us-central1
  SEARCHARIS_VERTEX_LOCATION: global
  SEARCHARIS_DEMO_REPOSITORY: AKzar1el/searcharis
  SEARCHARIS_SKIP_SECRET_IAM: "true"
  WIF_PROVIDER: projects/65161687668/locations/global/workloadIdentityPools/github-actions/providers/searcharis
  WIF_SERVICE_ACCOUNT: searcharis-deployer@searcharis.iam.gserviceaccount.com

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out deployment branch
        uses: actions/checkout@v7

      - name: Authenticate to Google Cloud with OIDC
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.GOOGLE_CLOUD_PROJECT }}
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.WIF_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ env.GOOGLE_CLOUD_PROJECT }}

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.1"
          enable-cache: true

      - name: Verify reviewed source
        run: |
          uv python install 3.13
          uv sync --locked
          uv run ruff check src tests demo_target
          bash -n deployment/*.sh
          uv run pytest tests/unit tests/integration -q

      - name: Verify Google identity
        run: |
          gcloud config set project "$GOOGLE_CLOUD_PROJECT"
          gcloud auth list --filter=status:ACTIVE --format='value(account)'
          gcloud projects describe "$GOOGLE_CLOUD_PROJECT" --format='value(projectId,projectNumber)'

      - name: Diagnose existing Cloud Run service configuration
        run: |
          describe_service() {
            service="$1"
            echo "===== ${service}: service configuration ====="
            gcloud run services describe "$service" \
              --region="$GOOGLE_CLOUD_LOCATION" \
              --format='yaml(metadata.annotations,status.url,status.conditions,spec.template.metadata.annotations,spec.template.spec.serviceAccountName,spec.template.spec.containers[0].env)'
            echo "===== ${service}: IAM policy ====="
            gcloud run services get-iam-policy "$service" \
              --region="$GOOGLE_CLOUD_LOCATION" \
              --format=yaml
          }

          describe_service searcharis-ingress
          describe_service searcharis-demo-target

          echo "===== HTTP comparison ====="
          PROJECT_NUMBER="$(gcloud projects describe "$GOOGLE_CLOUD_PROJECT" --format='value(projectNumber)')"
          probe() {
            label="$1"
            url="$2"
            body="$(mktemp)"
            code="$(curl --silent --show-error --output "$body" --write-out '%{http_code}' "$url" || true)"
            echo "$label -> HTTP $code ($url)"
            if [[ "$code" != 2* ]]; then
              head -c 300 "$body" || true
              echo
            fi
            rm -f "$body"
          }

          INGRESS_STATUS_URL="$(gcloud run services describe searcharis-ingress --region="$GOOGLE_CLOUD_LOCATION" --format='value(status.url)')"
          DEMO_STATUS_URL="$(gcloud run services describe searcharis-demo-target --region="$GOOGLE_CLOUD_LOCATION" --format='value(status.url)')"
          INGRESS_DETERMINISTIC_URL="https://searcharis-ingress-${PROJECT_NUMBER}.${GOOGLE_CLOUD_LOCATION}.run.app"
          DEMO_DETERMINISTIC_URL="https://searcharis-demo-target-${PROJECT_NUMBER}.${GOOGLE_CLOUD_LOCATION}.run.app"

          probe "ingress status.url" "${INGRESS_STATUS_URL}/healthz"
          probe "ingress deterministic" "${INGRESS_DETERMINISTIC_URL}/healthz"
          probe "demo status.url" "${DEMO_STATUS_URL}/"
          probe "demo deterministic" "${DEMO_DETERMINISTIC_URL}/"

          echo "Diagnostic-only run complete; stopping before redeployment."
          exit 1

      - name: Deploy deterministic demo target
        run: ./deployment/deploy-demo-target.sh

      - name: Capture demo target URL
        run: |
          DEMO_URL="$(gcloud run services describe searcharis-demo-target \
            --region="$GOOGLE_CLOUD_LOCATION" \
            --format='value(status.url)')"
          echo "SEARCHARIS_DEMO_TARGET_URL=$DEMO_URL" >> "$GITHUB_ENV"
          echo "Demo target: $DEMO_URL"

      - name: Deploy Searcharis worker and ingress
        run: ./deployment/deploy-services.sh

      - name: Run cloud smoke test
        run: ./deployment/smoke.sh

      - name: Capture deployed URLs
        id: urls
        run: |
          INGRESS_URL="$(gcloud run services describe searcharis-ingress \
            --region="$GOOGLE_CLOUD_LOCATION" \
            --format='value(status.url)')"
          WORKER_URL="$(gcloud run services describe searcharis-worker \
            --region="$GOOGLE_CLOUD_LOCATION" \
            --format='value(status.url)')"
          DEMO_URL="$(gcloud run services describe searcharis-demo-target \
            --region="$GOOGLE_CLOUD_LOCATION" \
            --format='value(status.url)')"

          {
            echo '## Searcharis Google Cloud deployment'
            echo
            echo "- Public app: $INGRESS_URL"
            echo "- Private worker: $WORKER_URL"
            echo "- Demo target: $DEMO_URL"
            echo "- Cloud Run region: $GOOGLE_CLOUD_LOCATION"
            echo "- Vertex AI location: $SEARCHARIS_VERTEX_LOCATION"
            echo "- Commit: $GITHUB_SHA"
          } >> "$GITHUB_STEP_SUMMARY"

          printf 'Ingress: %s\nWorker: %s\nDemo: %s\n' "$INGRESS_URL" "$WORKER_URL" "$DEMO_URL"
