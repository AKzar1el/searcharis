name: Deploy to Google Cloud

on:
  push:
    branches: [gcp-deploy]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: searcharis-gcp-deploy
  cancel-in-progress: false

env:
  GOOGLE_CLOUD_PROJECT: searcharis
  GOOGLE_CLOUD_LOCATION: us-central1
  SEARCHARIS_VERTEX_LOCATION: global
  SEARCHARIS_DEMO_REPOSITORY: AKzar1el/searcharis
  SEARCHARIS_SKIP_SECRET_IAM: "true"
  WIF_PROVIDER: projects/65161687668/locations/global/workloadIdentityPools/github-actions/providers/searcharis
  WIF_SERVICE_ACCOUNT: searcharis-deployer@searcharis.iam.gserviceaccount.com

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out deployment branch
        uses: actions/checkout@v7

      - name: Authenticate to Google Cloud with OIDC
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.GOOGLE_CLOUD_PROJECT }}
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.WIF_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ env.GOOGLE_CLOUD_PROJECT }}

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.1"
          enable-cache: true

      - name: Verify reviewed source
        run: |
          uv python install 3.13
          uv sync --locked
          uv run ruff check src tests demo_target
          bash -n deployment/*.sh
          uv run pytest tests/unit tests/integration -q

      - name: Verify Google identity
        run: |
          gcloud config set project "$GOOGLE_CLOUD_PROJECT"
          gcloud auth list --filter=status:ACTIVE --format='value(account)'
          gcloud projects describe "$GOOGLE_CLOUD_PROJECT" --format='value(projectId,projectNumber)'

      - name: Diagnose existing Cloud Run traffic and public routing
        run: |
          echo "===== ingress traffic ====="
          gcloud run services describe searcharis-ingress \
            --region="$GOOGLE_CLOUD_LOCATION" \
            --format='yaml(spec.traffic,status.traffic,status.latestCreatedRevisionName,status.latestReadyRevisionName,status.url)'

          echo "===== demo traffic ====="
          gcloud run services describe searcharis-demo-target \
            --region="$GOOGLE_CLOUD_LOCATION" \
            --format='yaml(spec.traffic,status.traffic,status.latestCreatedRevisionName,status.latestReadyRevisionName,status.url)'

          INGRESS_URL="$(gcloud run services describe searcharis-ingress --region="$GOOGLE_CLOUD_LOCATION" --format='value(status.url)')"
          DEMO_URL="$(gcloud run services describe searcharis-demo-target --region="$GOOGLE_CLOUD_LOCATION" --format='value(status.url)')"

          probe() {
            label="$1"
            url="$2"
            headers="$(mktemp)"
            body="$(mktemp)"
            code="$(curl --silent --show-error --dump-header "$headers" --output "$body" --write-out '%{http_code}' "$url" || true)"
            echo "----- $label -> HTTP $code ($url) -----"
            sed -n '1,20p' "$headers"
            echo "body:"
            head -c 500 "$body" || true
            echo
            rm -f "$headers" "$body"
          }

          probe "ingress anonymous root" "${INGRESS_URL}/"
          probe "ingress anonymous health" "${INGRESS_URL}/healthz"
          probe "ingress anonymous incidents" "${INGRESS_URL}/api/incidents"
          probe "demo anonymous root" "${DEMO_URL}/"
          probe "demo anonymous health" "${DEMO_URL}/healthz"

          echo "Diagnostic-only run complete; stopping before redeployment."
          exit 1

      - name: Deploy deterministic demo target
        run: ./deployment/deploy-demo-target.sh

      - name: Capture demo target URL
        run: |
          DEMO_URL="$(gcloud run services describe searcharis-demo-target \
            --region="$GOOGLE_CLOUD_LOCATION" \
            --format='value(status.url)')"
          echo "SEARCHARIS_DEMO_TARGET_URL=$DEMO_URL" >> "$GITHUB_ENV"
          echo "Demo target: $DEMO_URL"

      - name: Deploy Searcharis worker and ingress
        run: ./deployment/deploy-services.sh

      - name: Run cloud smoke test
        run: ./deployment/smoke.sh

      - name: Capture deployed URLs
        id: urls
        run: |
          INGRESS_URL="$(gcloud run services describe searcharis-ingress \
            --region="$GOOGLE_CLOUD_LOCATION" \
            --format='value(status.url)')"
          WORKER_URL="$(gcloud run services describe searcharis-worker \
            --region="$GOOGLE_CLOUD_LOCATION" \
            --format='value(status.url)')"
          DEMO_URL="$(gcloud run services describe searcharis-demo-target \
            --region="$GOOGLE_CLOUD_LOCATION" \
            --format='value(status.url)')"

          {
            echo '## Searcharis Google Cloud deployment'
            echo
            echo "- Public app: $INGRESS_URL"
            echo "- Private worker: $WORKER_URL"
            echo "- Demo target: $DEMO_URL"
            echo "- Cloud Run region: $GOOGLE_CLOUD_LOCATION"
            echo "- Vertex AI location: $SEARCHARIS_VERTEX_LOCATION"
            echo "- Commit: $GITHUB_SHA"
          } >> "$GITHUB_STEP_SUMMARY"

          printf 'Ingress: %s\nWorker: %s\nDemo: %s\n' "$INGRESS_URL" "$WORKER_URL" "$DEMO_URL"
