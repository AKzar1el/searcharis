name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.1"
          enable-cache: true
      - name: Set up Python
        run: uv python install 3.13
      - name: Install dependencies
        run: |
          if [ -f uv.lock ]; then
            uv sync --locked
          else
            uv sync
          fi
      - name: Ruff
        run: uv run ruff check src tests demo_target
      - name: Shell syntax
        run: bash -n deployment/*.sh
      - name: Tests
        run: uv run pytest tests/unit tests/integration -q
