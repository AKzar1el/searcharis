name: CI

on:
  push:
    branches: [main, master, implementation]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.10.0"
          enable-cache: true
      - name: Set up Python
        run: uv python install 3.13
      - name: Install dependencies
        run: |
          if [ -f uv.lock ]; then
            uv sync --locked
          else
            uv sync
          fi
      - name: Ruff
        run: uv run ruff check src tests demo_target
      - name: Tests
        run: uv run pytest tests/unit tests/integration -q
