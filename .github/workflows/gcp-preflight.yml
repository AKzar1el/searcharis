name: GCP preflight

on:
  push:
    branches: [gcp-preflight]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.1"
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.13

      - name: Generate and verify lockfile
        run: |
          uv lock
          uv lock --check
          uv sync --locked

      - name: Lint and deployment script syntax
        run: |
          uv run ruff check src tests demo_target
          bash -n deployment/*.sh

      - name: Unit and integration suite
        run: uv run pytest tests/unit tests/integration -q

      - name: Repeat concurrency stress tests
        run: |
          for run in 1 2 3; do
            echo "stress pass ${run}"
            uv run pytest tests/integration/test_orchestrator.py -m stress -q
          done

      - name: Verify real Google SDK and ADK import contract
        run: |
          uv run python - <<'PY'
          from google.cloud import firestore, pubsub_v1, tasks_v2
          from searcharis.agent.diagnostician import MODEL_ID, build_root_agent

          assert firestore is not None
          assert pubsub_v1 is not None
          assert tasks_v2 is not None
          assert MODEL_ID == "gemini-3.7-flash"
          agent = build_root_agent()
          assert getattr(agent, "name", None) == "searcharis_diagnostician"
          print(f"ADK contract OK: {type(agent).__name__}, model={MODEL_ID}")
          PY

      - name: Build Python distribution
        run: uv build

      - name: Build production containers
        run: |
          docker build -t searcharis-preflight:latest .
          docker build -t searcharis-demo-preflight:latest demo_target

      - name: Live hosted validator smoke test
        env:
          SEARCHARIS_LIVE_TEST_URL: https://digestseo.com/
        run: uv run pytest tests/live/test_validator_live.py -m live -q

      - name: Commit generated lockfile
        run: |
          git add uv.lock
          if git diff --cached --quiet -- uv.lock; then
            echo "uv.lock already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: lock preflight dependencies [skip ci]"
          git push origin HEAD:gcp-preflight
